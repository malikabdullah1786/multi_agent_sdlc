version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sdlc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sdlc
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  agents:
    build:
      context: ../../agents
      dockerfile: Dockerfile
    environment:
      - LANGSMITH_TRACING=true
    depends_on:
      - redis

volumes:
  postgres_data:
